<!doctype html>
<html lang="ru" data-color-mode="dark" data-dark-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>black.mark.cord</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown-dark.min.css">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; min-height: 100%; background: #0d1117; }
    body {
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    }
    .page { box-sizing: border-box; width: 100%; max-width: 1012px; margin: 0 auto; padding: 32px; }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 0;
      background: #0d1117;
      color: #f0f6fc;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3,
    .markdown-body h4, .markdown-body h5, .markdown-body h6 { color: #f0f6fc; }
    .markdown-body a { color: #4493f8; }
    .markdown-body code, .markdown-body tt, .markdown-body pre { background-color: #151b23; }
    .markdown-body hr { background-color: #3d444d; }
    .markdown-body blockquote { color: #9198a1; border-left-color: #3d444d; }
    #loading { color: #9198a1; }
    @media (max-width: 767px) { .page { padding: 20px 16px; } }
  </style>
</head>
<body>
  <main class="page">
    <article id="content" class="markdown-body">
      <p id="loading">Загрузка README…</p>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script>
    const content = document.getElementById('content');
    marked.setOptions({ gfm: true, breaks: false });

    fetch('./README.md', { cache: 'no-cache' })
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.text();
      })
      .then(markdown => { content.innerHTML = marked.parse(markdown); })
      .catch(error => {
        content.innerHTML = `<h1>black.mark.cord</h1><p>Не удалось загрузить README.md.</p><pre><code>${String(error)}</code></pre>`;
      });
  </script>
</body>
</html>
